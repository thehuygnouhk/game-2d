npc:
  npc001.name: "Thầy Bạch Vân"
  npc001.line: "Mỗi trang sách đều có chỗ của nó. Đi săn cẩn thận nhé."
  npc002.name: "Bà Mơ"
  npc002.line: "Ăn no rồi hẵng đi, con."
  npc003.name: "Lam Nhi"
  npc003.line: "Mình vừa chế xong mẻ thuốc mới. Cần bình máu thì ghé mua nhé!"
  npc004.name: "Khôi"
  npc004.line: "Ra Đồng Hoa đi, Vua Nấm Lùn hay xuất hiện ở đó lắm."
  npc040.name: "Cụ Trương"
  npc040.line: "Lịch boss dán trên bảng tin làng đây, xem đi con."
  npc005.name: "Chấp Bút Hạc Minh"
  npc005.line: "Khò… Hả? Ta không ngủ đâu, ta đang đọc sách bằng mắt nhắm thôi."
  npc011.name: "Viện Chủ Vân Tước"
  npc011.line: "Gió Thượng Đô đổi hướng nhanh lắm. Đi đâu cũng nhớ nhìn đường."
  npc046.name: "Giám Khảo Tuyển Thư"
  npc046.line: "Mùa Tuyển Thư năm nay ba vòng. Ai muốn ghi danh thì xếp hàng."
  npc003.line_m005: "Thượng Đô cái gì cũng đắt! May mà mình mang theo nồi chế thuốc. Mua bình không?"
  npc004.line_m009: "Lợn rừng ở đây húc đau hơn chó rừng nhiều. Thấy nó cúi đầu là nhảy lên né."
