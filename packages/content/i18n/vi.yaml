scene:
  q_main_11.1: "Ngồi xuống đây cả ba. Mai là Lễ Khai Thư rồi."   # NPC001
  q_main_11.2: "Con hồi hộp quá thầy ạ. Lỡ Huyền Thư của con chẳng chịu mở thì sao?"   # NPC003
  q_main_11.3: "Mở hay không thì cậu vẫn chế thuốc giỏi nhất làng mà."   # NPC004
  q_main_11.4: "Huyền Thư không chọn người mạnh nhất. Nó chọn người biết mình muốn viết gì."   # NPC001
  q_main_11.5: "Con muốn biết tờ giấy trắng dưới giếng là gì, và ai đã xóa nó."   # PLAYER
  q_main_11.6: "…Ngủ sớm đi. Mai thầy đợi ở lễ đường."   # NPC001
  q_main_12.1: "Huyền Thư đã nhận con. Từ nay con tự viết đường đi của mình."   # NPC001
  q_main_12.2: "Thầy còn vài trang sách cũ phải đi tìm lại. Đừng lo cho thầy."   # NPC001
  letter: "Đừng tìm thầy. Hãy tìm Mười Hai Quyển."
