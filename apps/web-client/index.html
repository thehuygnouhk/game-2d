<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Huyền Thư Ký</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="wrap">
      <div id="stage">
        <div id="game"></div>
        <div id="status" class="hud" hidden></div>
        <form id="join" class="card">
          <h1>Huyền Thư Ký</h1>
          <p class="sub">Bản online · Làng Suối Mơ (Chương 1)</p>
          <label
            >Tên nhân vật
            <input id="name" maxlength="12" autocomplete="off" spellcheck="false" placeholder="3 đến 12 ký tự" required
          /></label>
          <div class="row">
            <label
              >Giới tính
              <select id="gender">
                <option value="MALE">Nam</option>
                <option value="FEMALE">Nữ</option>
              </select>
            </label>
            <label
              >Xuất thân
              <select id="origin">
                <option value="VILLAGER">Dân Làng</option>
                <option value="NOBLE">Thế Gia</option>
                <option value="ANCIENT">Hậu Duệ Tộc Cổ Thư</option>
              </select>
            </label>
          </div>
          <button type="submit">Vào game</button>
          <p id="err" class="err" role="alert"></p>
        </form>
      </div>
      <p class="keys">
        <b>A D</b> hoặc <b>← →</b> đi · <b>Space</b> nhảy · <b>W</b> hoặc <b>↑</b> nhảy, leo thang, qua cổng ·
        <b>S</b> hoặc <b>↓</b> xuống nền mỏng, xuống thang · <b>J</b> Đòn Thường · <b>1</b> Tụ Mana Chấn (Lv5) ·
        <b>Q</b> <b>E</b> bình HP, MP · <b>Tab</b> hoặc nhấp chuột chọn quái · <b>Enter</b> chat
      </p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
